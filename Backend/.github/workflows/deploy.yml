name: Deploy Task Management Backend (Staging)

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

concurrency:
  group: task-management-backend-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.STAGING_DOCKERHUB_USERNAME }}
          password: ${{ secrets.STAGING_DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        env:
          IMAGE: ${{ secrets.STAGING_DOCKERHUB_USERNAME }}/task-management-backend:${{ github.sha }}
        run: |
          docker buildx build \
            --push \
            --tag "$IMAGE" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Authenticate Docker on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.STAGING_DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.STAGING_DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_DO_HOST }}
          username: root
          key: ${{ secrets.STAGING_DO_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ secrets.STAGING_DOCKERHUB_USERNAME }}/task-management-backend:${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_DO_HOST }}
          username: root
          key: ${{ secrets.STAGING_DO_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e
            docker image prune -af || true
            /var/www/task-management/scripts/deploy-slot.sh backend "$IMAGE"
